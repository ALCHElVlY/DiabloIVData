name: Sync upstream

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
      head: ${{ steps.merge.outputs.head }}
    steps:
      # Uses GitHub's "Sync fork" API, so the ~18 GB tree is never checked out.
      - id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Scheduled runs carry no repository payload, so ask the API.
          branch="$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)"
          merge_type="$(gh api -X POST "repos/$GITHUB_REPOSITORY/merge-upstream" -f branch="$branch" --jq .merge_type)"
          echo "Merge type: $merge_type"

          if [ "$merge_type" = 'none' ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
          echo "head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$branch" --jq .sha)" >> "$GITHUB_OUTPUT"

  # Pushes made with GITHUB_TOKEN don't trigger other workflows, so publish
  # the API from here when upstream brought in new data.
  publish:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish-api.yml
    with:
      ref: ${{ needs.sync.outputs.head }}
